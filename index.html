<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
  <title>自动计算小助手</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="sparkle-layer" aria-hidden="true">
    <span>✦</span><span>✧</span><span>✦</span>
    <span>✧</span><span>⋆</span><span>✦</span>
  </div>

  <div class="container">
    <header class="app-header">
      <h1>✦ 🧮 自动计算小助手 ✦</h1>
      <p class="subtitle">输完稍等自动加，不用按回车 ☁</p>
    </header>

    <main class="main-grid">
      <section class="card calculator">
        <div class="total-display">
          <span class="total-label">当前总计</span>
          <span class="total-value" id="totalValue">0</span>
        </div>

        <div class="input-wrapper">
          <div class="single-input-row">
            <input
              type="text"
              id="numInput"
              placeholder="输完数字稍等或按 ↵ / 空格 / 逗号 自动添加"
              autocomplete="off"
              autofocus
            />
            <button class="btn btn-primary" id="btnAddOne">+ 添加</button>
            <button class="btn btn-secondary" id="btnClearInput">🗑 清空列表</button>
          </div>
          <div class="input-hint">
            已输入 <strong id="countNum">0</strong> 个数字，
            合计 <strong id="subTotal">0</strong>
            <span class="hint-right">停顿自动识别 · 粘贴自动拆分多个</span>
          </div>
        </div>

        <div class="chip-area" id="chipArea">
          <span class="chip-empty">还没有数字，输一个试试吧</span>
        </div>

        <div class="actions">
          <button class="btn btn-primary" id="btnSave">💾 保存为记录</button>
          <button class="btn btn-secondary" id="btnImage">🖼 保存图片</button>
          <button class="btn btn-ghost" id="btnExport">📥 导出 CSV</button>
        </div>
      </section>
    </main>
  </div>

  <button class="btn-history-fab" id="btnHistory" aria-label="历史记录">
    📒
    <span class="fab-badge" id="fabBadge">0</span>
  </button>

  <div class="modal-overlay" id="historyModal" aria-hidden="true">
    <div class="modal-content">
      <div class="modal-header">
        <h2>📒 历史记录 <span class="history-count" id="historyCount">0 条</span></h2>
        <div class="modal-header-actions">
          <button class="btn btn-danger btn-sm" id="btnClearAll">⚠ 清空所有记录</button>
          <button class="modal-close" id="modalClose" aria-label="关闭">✕</button>
        </div>
      </div>
      <div class="history-list" id="historyList">
        <p class="empty-tip">还没有记录，输入数字后点击"保存为记录"吧</p>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="imgModal" aria-hidden="true">
    <div class="modal-content img-modal">
      <div class="modal-header">
        <h2>🖼 计算结果图片</h2>
        <button class="modal-close" id="imgClose" aria-label="关闭">✕</button>
      </div>
      <div class="img-body">
        <img id="imgPreview" alt="计算结果图片预览" />
        <p class="img-tip">手机浏览器可长按上方图片保存，或点击"下载图片"</p>
      </div>
      <div class="img-actions">
        <a class="btn btn-primary" id="imgDownload" download>⬇ 下载图片</a>
        <button class="btn btn-secondary" id="imgCancel">关闭</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
